name: Bug report
description: Something in Who Left The Light On doesn't work as it should
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them.
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Helmet lighting isn't restored
        - Vehicle lights aren't restored
        - Vehicle suction isn't restored
        - Vehicle Boost Lock
        - The wrong preference comes back
        - Hot loading with LunarLink
        - The game crashed or froze
        - Something else
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How it's installed
      options:
        - BepInEx/plugins/ (normal)
        - BepInEx/hot/ with LunarLink
        - Through a mod manager (Vortex or similar)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "The lines from `BepInEx/LogOutput.log` that mention Who Left The Light On, plus the contents of `BepInEx/config/WhoLeftTheLightOn.preferences` and `BepInEx/config/tylerun.moonsweepers.wholeftthelighton.cfg`."
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Who Left The Light On (the log says \"Who Left The Light On? x.y.z loaded\"), BepInEx, and the game."
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The other plugins you have installed.
